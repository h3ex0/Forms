<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Answer Vault</title>
<meta name="description" content="Private, password-gated answer collection." />
<style>
  /* ----------  Fonts (with safe system fallback)  ---------- */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  /* ----------  Design tokens  ---------- */
  :root{
    --color-primary:#1E3A5F;
    --color-on-primary:#FFFFFF;
    --color-secondary:#334155;
    --color-accent:#059669;
    --color-accent-hover:#047857;
    --color-bg:#0F172A;
    --color-fg:#F8FAFC;
    --color-muted-surface:#141E33;
    --color-surface:#16223B;
    --color-border:rgba(255,255,255,0.08);
    --color-border-strong:rgba(255,255,255,0.16);
    --color-destructive:#DC2626;
    --color-destructive-hover:#B91C1C;
    --color-fg-muted:#94A3B8;
    --color-fg-subtle:#64748B;
    --ring:0 0 0 3px rgba(5,150,105,0.45);
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 20px 50px -12px rgba(0,0,0,0.6);
    --t:180ms cubic-bezier(.2,.6,.2,1);
    --maxw:760px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 600px at 15% -10%, rgba(30,58,95,.55), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(5,150,105,.18), transparent 55%),
      var(--color-bg);
    color:var(--color-fg);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    min-height:100dvh;
  }

  /* ----------  Layout  ---------- */
  .wrap{
    width:100%;
    max-width:var(--maxw);
    margin:0 auto;
    padding:clamp(20px,5vw,56px) clamp(16px,4vw,28px);
  }
  .center-screen{
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:24px 16px;
  }
  .hidden{display:none !important;}

  /* ----------  Brand  ---------- */
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
  .brand-badge{
    width:42px;height:42px;border-radius:12px;
    display:grid;place-items:center;
    background:linear-gradient(140deg,var(--color-primary),#2b5a8f);
    border:1px solid var(--color-border-strong);
    color:#fff;flex:none;
  }
  .brand-name{font-weight:700;letter-spacing:-.02em;font-size:1.05rem;}
  .brand-sub{font-size:.78rem;color:var(--color-fg-muted);margin-top:1px;}

  /* ----------  Card  ---------- */
  .card{
    width:100%;
    background:linear-gradient(180deg, rgba(22,34,59,.92), rgba(18,28,49,.92));
    border:1px solid var(--color-border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:clamp(22px,4vw,34px);
  }
  .lock-card{max-width:440px;}

  h1.title{
    font-size:clamp(1.9rem,4.5vw,2.6rem);
    font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:0 0 8px;
  }
  .lede{color:var(--color-fg-muted);margin:0 0 26px;font-size:.98rem;}
  h2.section{font-size:1.18rem;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;}
  .muted{color:var(--color-fg-muted);}
  .subtle{color:var(--color-fg-subtle);font-size:.82rem;}

  /* ----------  Form controls  ---------- */
  label.field-label{display:block;font-size:.82rem;font-weight:600;color:var(--color-fg-muted);margin:0 0 7px;letter-spacing:.01em;}
  .req{color:var(--color-accent);}
  .input,.textarea,select{
    width:100%;
    background:var(--color-bg);
    border:1px solid var(--color-border-strong);
    color:var(--color-fg);
    border-radius:var(--radius-sm);
    padding:13px 14px;
    font:inherit;font-size:1rem;
    transition:border-color var(--t),box-shadow var(--t),background var(--t);
    outline:none;
  }
  .textarea{min-height:120px;resize:vertical;line-height:1.55;}
  .input::placeholder,.textarea::placeholder{color:var(--color-fg-subtle);}
  .input:focus,.textarea:focus,select:focus{border-color:var(--color-accent);box-shadow:var(--ring);background:#0c1424;}
  .pw-wrap{position:relative;}
  .pw-wrap .input{padding-right:48px;letter-spacing:.06em;}
  .pw-toggle{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:38px;height:38px;border:0;background:transparent;color:var(--color-fg-muted);
    border-radius:9px;display:grid;place-items:center;cursor:pointer;transition:color var(--t),background var(--t);
  }
  .pw-toggle:hover{color:var(--color-fg);background:rgba(255,255,255,.05);}
  .pw-toggle:focus-visible{outline:none;box-shadow:var(--ring);}

  /* ----------  Buttons  ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    font:inherit;font-weight:600;font-size:.96rem;
    border:1px solid transparent;border-radius:var(--radius-sm);
    padding:12px 18px;cursor:pointer;
    transition:background var(--t),border-color var(--t),transform var(--t),color var(--t),opacity var(--t);
    text-decoration:none;white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:none;box-shadow:var(--ring);}
  .btn-primary{background:var(--color-accent);color:#fff;}
  .btn-primary:hover{background:var(--color-accent-hover);}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;border-color:var(--color-border-strong);color:var(--color-fg);}
  .btn-ghost:hover{background:rgba(255,255,255,.05);border-color:var(--color-fg-subtle);}
  .btn-subtle{background:rgba(255,255,255,.05);color:var(--color-fg);}
  .btn-subtle:hover{background:rgba(255,255,255,.1);}
  .btn-danger{background:transparent;border-color:rgba(220,38,38,.45);color:#fca5a5;}
  .btn-danger:hover{background:rgba(220,38,38,.12);border-color:var(--color-destructive);}
  .btn-sm{padding:8px 12px;font-size:.85rem;border-radius:9px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .btn .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ----------  Alert / messages  ---------- */
  .alert{
    display:flex;gap:10px;align-items:flex-start;
    border-radius:var(--radius-sm);padding:11px 13px;font-size:.88rem;margin-top:14px;
    border:1px solid transparent;
  }
  .alert svg{flex:none;margin-top:1px;}
  .alert-error{background:rgba(220,38,38,.1);border-color:rgba(220,38,38,.4);color:#fca5a5;}
  .alert-info{background:rgba(5,150,105,.1);border-color:rgba(5,150,105,.35);color:#6ee7b7;}
  .alert-neutral{background:rgba(255,255,255,.04);border-color:var(--color-border);color:var(--color-fg-muted);}

  /* ----------  Top bar (inside app)  ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:24px;flex-wrap:wrap;
  }
  .who{display:flex;align-items:center;gap:11px;}
  .avatar{
    width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;
    font-weight:700;font-size:.95rem;color:#fff;
    background:linear-gradient(140deg,var(--color-primary),#2b5a8f);
    border:1px solid var(--color-border-strong);
  }
  .avatar.admin{background:linear-gradient(140deg,var(--color-accent),#0ea371);}
  .who-name{font-weight:700;letter-spacing:-.01em;}
  .who-role{font-size:.78rem;color:var(--color-fg-muted);}

  /* ----------  Tabs  ---------- */
  .tabs{display:flex;gap:4px;background:var(--color-muted-surface);border:1px solid var(--color-border);border-radius:12px;padding:4px;margin-bottom:22px;}
  .tab{
    flex:1;border:0;background:transparent;color:var(--color-fg-muted);
    font:inherit;font-weight:600;font-size:.88rem;padding:9px 10px;border-radius:9px;cursor:pointer;
    transition:background var(--t),color var(--t);display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .tab:hover{color:var(--color-fg);}
  .tab[aria-selected="true"]{background:var(--color-surface);color:var(--color-fg);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 2px 8px rgba(0,0,0,.25);}
  .tab:focus-visible{outline:none;box-shadow:var(--ring);}

  /* ----------  Question blocks  ---------- */
  .q-block{margin-bottom:18px;}
  .q-text{font-weight:600;margin:0 0 9px;font-size:1rem;}
  .q-index{color:var(--color-accent);font-weight:700;margin-right:6px;}

  /* ----------  Lists / rows  ---------- */
  .row{
    display:flex;align-items:center;gap:14px;
    background:var(--color-muted-surface);border:1px solid var(--color-border);
    border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;
  }
  .row .grow{flex:1;min-width:0;}
  .row-title{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .row-meta{font-size:.8rem;color:var(--color-fg-muted);margin-top:3px;}
  .answer-q{font-size:.78rem;color:var(--color-fg-subtle);margin:10px 0 2px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .answer-a{white-space:pre-wrap;word-break:break-word;color:var(--color-fg);}
  .submission{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;background:rgba(255,255,255,.02);}
  .submission-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .submission-no{font-weight:700;font-size:.82rem;color:var(--color-accent);}
  .submission-time{font-size:.76rem;color:var(--color-fg-muted);}
  .pill{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid transparent;letter-spacing:.02em;}
  .pill-done{background:rgba(5,150,105,.14);color:#6ee7b7;border-color:rgba(5,150,105,.35);}
  .pill-wait{background:rgba(148,163,184,.12);color:var(--color-fg-muted);border-color:var(--color-border-strong);}

  details.resp{background:var(--color-muted-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;}
  details.resp>summary{
    list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:12px;
    transition:background var(--t);
  }
  details.resp>summary::-webkit-details-marker{display:none;}
  details.resp>summary:hover{background:rgba(255,255,255,.03);}
  details.resp .body{padding:14px;border-top:1px solid var(--color-border);}
  .chev{transition:transform var(--t);color:var(--color-fg-muted);flex:none;}
  details.resp[open] .chev{transform:rotate(90deg);}

  .divider{height:1px;background:var(--color-border);margin:24px 0;border:0;}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .actions.end{justify-content:flex-end;}
  .grid-2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;}
  @media (max-width:520px){.grid-2{grid-template-columns:1fr;}}

  .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .stat{flex:1;min-width:110px;background:var(--color-muted-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:14px 16px;}
  .stat-num{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .stat-label{font-size:.78rem;color:var(--color-fg-muted);margin-top:5px;}

  .empty{text-align:center;color:var(--color-fg-muted);padding:34px 16px;border:1px dashed var(--color-border-strong);border-radius:var(--radius-sm);}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;}

  /* ----------  Toast  ---------- */
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--color-surface);border:1px solid var(--color-border-strong);
    color:var(--color-fg);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);
    font-size:.9rem;display:flex;align-items:center;gap:9px;
    opacity:0;pointer-events:none;transition:opacity var(--t),transform var(--t);z-index:50;max-width:90vw;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.ok svg{color:var(--color-accent);}
  #toast.err svg{color:var(--color-destructive);}

  .entrance{animation:rise 320ms cubic-bezier(.2,.7,.2,1) both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .footnote{margin-top:18px;font-size:.78rem;color:var(--color-fg-subtle);text-align:center;line-height:1.5;}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
  }
</style>
</head>
<body>

<!-- ============ LOCK SCREEN ============ -->
<main id="screen-lock" class="center-screen">
  <div class="lock-card card entrance">
    <div class="brand">
      <div class="brand-badge" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM140,150.81V172a12,12,0,0,1-24,0V150.81a20,20,0,1,1,24,0Z"/></svg>
      </div>
      <div>
        <div class="brand-name">Answer Vault</div>
        <div class="brand-sub">Private · encrypted access</div>
      </div>
    </div>

    <h1 class="title">Enter your access code</h1>
    <p class="lede">Type the code your admin gave you. Your responses stay private — only the admin can review answers.</p>

    <form id="lock-form" autocomplete="off" novalidate>
      <label class="field-label" for="lock-input">Access code</label>
      <div class="pw-wrap">
        <input class="input" id="lock-input" type="password" inputmode="text"
               placeholder="• • • • • •" aria-describedby="lock-msg" autocomplete="off" />
        <button type="button" class="pw-toggle" id="lock-eye" aria-label="Show code" data-target="lock-input">
          <svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M247.31,124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57,61.26,162.88,48,128,48S61.43,61.26,36.34,86.35C17.51,105.18,9,124,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208s66.57-13.26,91.66-38.34c18.83-18.83,27.3-37.61,27.65-38.4A8,8,0,0,0,247.31,124.76ZM128,168a40,40,0,1,1,40-40A40,40,0,0,1,128,168Z"/></svg>
        </button>
      </div>

      <div id="lock-msg" class="alert alert-error hidden" role="alert" aria-live="assertive">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm-8,56a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm8,104a12,12,0,1,1,12-12A12,12,0,0,1,128,184Z"/></svg>
        <span id="lock-msg-text"></span>
      </div>

      <button type="submit" id="lock-submit" class="btn btn-primary btn-block" style="margin-top:18px;">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96Z"/></svg>
        <span>Unlock</span>
      </button>
    </form>

    <p class="footnote">Don't have a code? Ask your admin to add you.<br>Access codes are stored encrypted — they can't be read from this file.</p>
  </div>
</main>

<!-- ============ RESPONDENT SCREEN ============ -->
<main id="screen-user" class="wrap hidden"></main>

<!-- ============ ADMIN SCREEN ============ -->
<main id="screen-admin" class="wrap hidden"></main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
(function(){
  /* ============================================================
     Storage  (localStorage, base64-wrapped). Access codes are NEVER
     stored in plaintext — only a one-way PBKDF2/SHA-256 hash + salt.
     The original codes cannot be recovered from this file or storage.
  ============================================================ */

    trash:'<svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm16,136a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/></svg>',
    plus:'<svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg>',

  /* ============================================================
     Crypto helpers — one-way hashing of access codes
  ============================================================ */
  function bytesToHex(b){ let s=""; for(let i=0;i<b.length;i++) s+=b[i].toString(16).padStart(2,"0"); return s; }
  function hexToBytes(h){ const a=new Uint8Array(h.length/2); for(let i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16); return a; }
  function randSalt(){
    const a=new Uint8Array(16);
    if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
    else for(let i=0;i<16;i++) a[i]=Math.floor(Math.random()*256);
    return bytesToHex(a);
  }

  /* compact SHA-256 (ASCII/latin1 in) — used as fallback if Web Crypto is unavailable */
  function sha256Hex(ascii){
    function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
    const mp=Math.pow, maxWord=mp(2,32);
    let i,j,result="",words=[];
    const bitLen=ascii.length*8;
    let hash=sha256Hex.h=sha256Hex.h||[];
    const k=sha256Hex.k=sha256Hex.k||[];
    let pc=k.length; const comp={};
    for(let cand=2; pc<64; cand++){
      if(!comp[cand]){
        for(i=0;i<313;i+=cand) comp[i]=cand;
        hash[pc]=(mp(cand,.5)*maxWord)|0;
        k[pc++]=(mp(cand,1/3)*maxWord)|0;
      }
    }
    ascii+="\x80";
    while(ascii.length%64-56) ascii+="\x00";
    for(i=0;i<ascii.length;i++){
      j=ascii.charCodeAt(i);
      if(j>>8) return "";
      words[i>>2]|=j<<((3-i)%4)*8;
    }
    words[words.length]=(bitLen/maxWord)|0;
    words[words.length]=bitLen;
    for(j=0;j<words.length;){
      const w=words.slice(j,j+=16);
      const oldHash=hash;
      hash=hash.slice(0,8);
      for(i=0;i<64;i++){
        const w15=w[i-15], w2=w[i-2];
        const a=hash[0], e=hash[4];
        const t1=hash[7]
          +(rr(e,6)^rr(e,11)^rr(e,25))
          +((e&hash[5])^((~e)&hash[6]))
          +k[i]
          +(w[i]=(i<16)?w[i]:(
              w[i-16]
              +(rr(w15,7)^rr(w15,18)^(w15>>>3))
              +w[i-7]
              +(rr(w2,17)^rr(w2,19)^(w2>>>10))
            )|0);
        const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
        hash=[(t1+t2)|0].concat(hash);
        hash[4]=(hash[4]+t1)|0;
      }
      for(i=0;i<8;i++) hash[i]=(hash[i]+oldHash[i])|0;
    }
    for(i=0;i<8;i++){
      for(j=3;j+1;j--){
        const b=(hash[i]>>(j*8))&255;
        result+=((b<16)?0:"")+b.toString(16);
      }
    }
    return result;
  }
  function toLatin1(str){ return unescape(encodeURIComponent(str)); }

  // Derive a hash from a code + salt. force==='s' forces the JS fallback (for verifying 's1:' hashes).
  async function deriveHash(code, salt, force){
    const canSubtle = !!(window.crypto && window.crypto.subtle);
    if(force!=="s" && canSubtle){
      try{
        const enc=new TextEncoder();
        const km=await crypto.subtle.importKey("raw", enc.encode(code), {name:"PBKDF2"}, false, ["deriveBits"]);
        const bits=await crypto.subtle.deriveBits({name:"PBKDF2", salt:hexToBytes(salt), iterations:150000, hash:"SHA-256"}, km, 256);
        return "p1:"+bytesToHex(new Uint8Array(bits));
      }catch(e){ /* fall through to JS */ }
    }
    let h=toLatin1(salt+":"+code);
    for(let i=0;i<3000;i++){ h=sha256Hex(h+i); }
    return "s1:"+h;
  }
  async function checkHash(code, salt, stored){
    if(!stored || !salt) return false;
    const force = stored.slice(0,3)==="s1:" ? "s" : undefined;
    const h = await deriveHash(code, salt, force);
    return h === stored;
  }
  async function makeCred(code){ const salt=randSalt(); return { salt, hash: await deriveHash(code, salt) }; }

  /* ============================================================
     State
  ============================================================ */
  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

  async function buildDefaultState(){
    const mkUser = async (name, code)=>{ const c=await makeCred(code); return { id:uid(), name, salt:c.salt, hash:c.hash }; };
    const admin = await makeCred("Zamora2000");
    return {
      adminSalt: admin.salt,
      adminHash: admin.hash,
      questions: [ { id: uid(), text: "What is your answer?" } ],
      users: [ await mkUser("Ahmed","123456"), await mkUser("Jorge","234567") ],
      responses: {}   // userId -> [ { answers:{qId:text}, submittedAt } ]
    };
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return null;
      return JSON.parse(decodeURIComponent(escape(atob(raw))));
    }catch(e){ return null; }
  }
  function saveState(){
    try{
      localStorage.setItem(STORE_KEY, btoa(unescape(encodeURIComponent(JSON.stringify(state)))));
    }catch(e){ toast("Could not save — storage may be blocked.", "err"); }
  }

  let state = null;
  let session = null; // {role:'admin'} or {role:'user', userId}

  /* ----------  small helpers  ---------- */
  const el = (id)=>document.getElementById(id);
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function initials(name){ return (name||"").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase() || "?"; }
  function fmtDate(ts){ if(!ts) return ""; const d=new Date(ts); return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
  function subsOf(userId){ const r=state.responses[userId]; return Array.isArray(r)?r:[]; }

  let toastTimer;
  function toast(msg, kind){
    const t = el("toast");
    t.className = ""; void t.offsetWidth;
    t.innerHTML = (kind==="err"?ICON.x:ICON.check) + "<span>"+esc(msg)+"</span>";
    t.classList.add("show"); if(kind) t.classList.add(kind);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove("show"), 3200);
  }

  function showScreen(which){
    el("screen-lock").classList.toggle("hidden", which!=="lock");
    el("screen-user").classList.toggle("hidden", which!=="user");
    el("screen-admin").classList.toggle("hidden", which!=="admin");
    window.scrollTo(0,0);
  }

  function wireEye(btn){
    btn.addEventListener("click", ()=>{
      const inp = el(btn.dataset.target);
      const show = inp.type === "password";
      inp.type = show ? "text" : "password";
      btn.innerHTML = show ? ICON.eyeOff : ICON.eye;
      btn.setAttribute("aria-label", show ? "Hide code" : "Show code");
      inp.focus();
    });
  }
  wireEye(el("lock-eye"));

  /* ============================================================
     Code matching
  ============================================================ */
  async function whoIs(code){
    if(await checkHash(code, state.adminSalt, state.adminHash)) return "admin";
    for(const u of state.users){ if(await checkHash(code, u.salt, u.hash)) return u; }
    return null;
  }
  async function codeIsAdmin(code){ return await checkHash(code, state.adminSalt, state.adminHash); }
  async function codeMatchesUser(code, exceptId){
    for(const u of state.users){
      if(exceptId && u.id===exceptId) continue;
      if(await checkHash(code, u.salt, u.hash)) return true;
    }
    return false;
  }

  /* ============================================================
     LOCK SCREEN
  ============================================================ */
  const lockForm = el("lock-form");
  const lockInput = el("lock-input");
  const lockMsg = el("lock-msg");
  const lockMsgText = el("lock-msg-text");
  const lockSubmit = el("lock-submit");

  function lockError(text){
    lockMsgText.textContent = text;
    lockMsg.classList.remove("hidden");
    lockInput.setAttribute("aria-invalid","true");
  }
  function clearLockError(){
    lockMsg.classList.add("hidden");
    lockInput.removeAttribute("aria-invalid");
  }
  lockInput.addEventListener("input", clearLockError);

  function setLockBusy(busy){
    lockSubmit.disabled = busy;
    lockSubmit.innerHTML = busy
      ? '<span class="spinner"></span><span>Checking…</span>'
      : '<svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96Z"/></svg><span>Unlock</span>';
  }

  lockForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const code = lockInput.value.trim();
    if(!code){ lockError("Please enter your access code."); return; }
    setLockBusy(true);
    let who = null;
    try{ who = await whoIs(code); }catch(err){ /* ignore */ }
    setLockBusy(false);

    if(who==="admin"){ session={role:"admin"}; resetLock(); renderAdmin(); showScreen("admin"); return; }
    if(who){ session={role:"user", userId:who.id}; resetLock(); renderUser(); showScreen("user"); return; }
    lockError("No matching code found. Check the code or ask your admin for access.");
  });

  function resetLock(){
    lockInput.value = "";
    lockInput.type = "password";
    el("lock-eye").innerHTML = ICON.eye;
    el("lock-eye").setAttribute("aria-label","Show code");
    clearLockError();
  }
  function signOut(){
    session = null;
    showScreen("lock");
    setTimeout(()=>lockInput.focus(), 50);
  }

  /* ============================================================
     RESPONDENT SCREEN  (unlimited submissions, no lock)
  ============================================================ */
  function renderUser(){
    const user = state.users.find(u=>u.id===session.userId);
    if(!user){ signOut(); return; }
    const count = subsOf(user.id).length;
    const root = el("screen-user");

    const hasQ = state.questions.length>0;
    root.innerHTML = `
      <div class="topbar">
        <div class="who">
          <div class="avatar">${esc(initials(user.name))}</div>
          <div>
            <div class="who-name">Welcome, ${esc(user.name)}</div>
            <div class="who-role">Respondent · your answers are private</div>
          </div>
        </div>
        <button class="btn btn-subtle btn-sm" id="u-signout">${ICON.out} Sign out</button>
      </div>

      <form class="card entrance" id="u-form" autocomplete="off" novalidate>
        <h2 class="section">Your answer${state.questions.length>1?"s":""}</h2>
        <p class="subtle" style="margin:0 0 18px;">Fill in your response${state.questions.length>1?"s":""} and submit. You can submit as many times as you like — every entry is saved.</p>
        ${count>0?`<div class="alert alert-info" style="margin:0 0 18px;">${ICON.check}<span>You've submitted ${count} answer${count>1?"s":""} so far. Add another below whenever you want.</span></div>`:""}
        ${!hasQ ? `<div class="empty">The admin hasn't added any questions yet. Please check back later.</div>` :
          state.questions.map((q,i)=>`
          <div class="q-block">
            <label class="field-label" for="ans-${q.id}"><span class="q-index">${state.questions.length>1?("Q"+(i+1)):""}</span>${esc(q.text)} <span class="req">*</span></label>
            <textarea class="textarea" id="ans-${q.id}" data-qid="${q.id}" placeholder="Type your answer…"></textarea>
          </div>`).join("")}
        ${hasQ?`
        <div class="actions" style="margin-top:6px;">
          <button type="submit" class="btn btn-primary">${ICON.check} Submit answer</button>
        </div>`:""}
      </form>
      <p class="footnote">Answer Vault · responses are stored locally on this device.</p>`;

    el("u-signout").addEventListener("click", signOut);
    const form = el("u-form");
    if(form && hasQ){
      form.addEventListener("submit",(e)=>{ e.preventDefault(); submitUser(user); });
    }
  }

  function submitUser(user){
    const root = el("screen-user");
    const fields = root.querySelectorAll("textarea[data-qid]");
    const answers = {};
    let firstEmpty = null;
    for(const f of fields){
      const v = f.value.trim();
      if(!v && !firstEmpty) firstEmpty = f;
      answers[f.dataset.qid] = v;
    }
    if(firstEmpty){
      toast("Please answer all questions before submitting.", "err");
      firstEmpty.focus();
      return;
    }
    if(!Array.isArray(state.responses[user.id])) state.responses[user.id] = [];
    state.responses[user.id].push({ answers, submittedAt: Date.now() });
    saveState();
    toast("Answer submitted — you can add another.", "ok");
    renderUser(); // clears fields & updates the counter
  }

  /* ============================================================
     ADMIN SCREEN
  ============================================================ */
  let adminTab = "responses";

  function renderAdmin(){
    const root = el("screen-admin");
    root.innerHTML = `
      <div class="topbar">
        <div class="who">
          <div class="avatar admin">A</div>
          <div>
            <div class="who-name">Admin console</div>
            <div class="who-role">Review responses · manage people</div>
          </div>
        </div>
        <button class="btn btn-subtle btn-sm" id="a-signout">${ICON.out} Sign out</button>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="responses" aria-selected="${adminTab==='responses'}">Responses</button>
        <button class="tab" role="tab" data-tab="people" aria-selected="${adminTab==='people'}">People</button>
        <button class="tab" role="tab" data-tab="questions" aria-selected="${adminTab==='questions'}">Questions</button>
        <button class="tab" role="tab" data-tab="settings" aria-selected="${adminTab==='settings'}">Settings</button>
      </div>

      <div id="a-panel"></div>
      <p class="footnote">Answer Vault · data is stored locally in this browser. Use Settings → Export to back up or move it.</p>`;

    el("a-signout").addEventListener("click", signOut);
    root.querySelectorAll(".tab").forEach(t=>{
      t.addEventListener("click", ()=>{ adminTab = t.dataset.tab; renderAdmin(); });
    });

    const panel = el("a-panel");
    if(adminTab==="responses") renderResponses(panel);
    else if(adminTab==="people") renderPeople(panel);
    else if(adminTab==="questions") renderQuestions(panel);
    else renderSettings(panel);
  }

  /* ----  Responses tab  ---- */
  function renderResponses(panel){
    const total = state.users.length;
    const answered = state.users.filter(u=>subsOf(u.id).length>0).length;
    const totalSubs = state.users.reduce((n,u)=>n+subsOf(u.id).length,0);

    const rows = state.users.map(u=>{
      const subs = subsOf(u.id);
      const has = subs.length>0;
      const last = has ? subs[subs.length-1].submittedAt : null;
      const body = has ? subs.map((s,si)=>`
        <div class="submission">
          <div class="submission-head">
            <span class="submission-no">Answer ${si+1}</span>
            <span class="submission-time">${esc(fmtDate(s.submittedAt))}</span>
          </div>
          ${state.questions.map((q,qi)=>`
            <div class="q-block" style="margin-bottom:8px;">
              <div class="answer-q">${state.questions.length>1?("Q"+(qi+1)+" · "):""}${esc(q.text)}</div>
              <div class="answer-a">${esc((s.answers&&s.answers[q.id])||"—")}</div>
            </div>`).join("")}
        </div>`).join("") : `<p class="muted" style="margin:2px 0 6px;">${esc(u.name)} hasn't submitted anything yet.</p>`;

      return `
        <details class="resp">
          <summary>
            ${ICON.chev}
            <div class="avatar" style="width:34px;height:34px;font-size:.8rem;">${esc(initials(u.name))}</div>
            <div class="grow">
              <div class="row-title">${esc(u.name)}</div>
              <div class="row-meta">${has?(subs.length+" answer"+(subs.length>1?"s":"")+" · last "+esc(fmtDate(last))):"No response yet"}</div>
            </div>
            <span class="pill ${has?'pill-done':'pill-wait'}">${has?subs.length+' answered':'Pending'}</span>
          </summary>
          <div class="body">
            ${body}
            ${has?`<div class="actions" style="margin-top:4px;"><button class="btn btn-danger btn-sm" data-clear="${u.id}">${ICON.trash} Clear this person's answers</button></div>`:""}
          </div>
        </details>`;
    }).join("");

    panel.innerHTML = `
      <div class="stat-row">
        <div class="stat"><div class="stat-num">${totalSubs}</div><div class="stat-label">Total answers</div></div>
        <div class="stat"><div class="stat-num">${answered}</div><div class="stat-label">People answered</div></div>
        <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">People</div></div>
      </div>
      ${total===0 ? `<div class="empty">No people added yet. Go to the <strong>People</strong> tab to add someone.</div>` : rows}`;

    panel.querySelectorAll("[data-clear]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const u = state.users.find(x=>x.id===b.dataset.clear);
        if(!u) return;
        if(confirm("Clear ALL of "+u.name+"'s answers? They can submit again afterwards. This cannot be undone.")){
          delete state.responses[u.id];
          saveState();
          toast(u.name+"'s answers cleared.", "ok");
          renderAdmin();
        }
      });
    });
  }

  /* ----  People tab  ---- */
  function renderPeople(panel){
    const rows = state.users.map(u=>{
      const n = subsOf(u.id).length;
      return `
        <div class="row">
          <div class="avatar" style="width:36px;height:36px;font-size:.82rem;">${esc(initials(u.name))}</div>
          <div class="grow">
            <div class="row-title">${esc(u.name)} ${n>0?'<span class="pill pill-done">'+n+' answer'+(n>1?'s':'')+'</span>':'<span class="pill pill-wait">Pending</span>'}</div>
            <div class="row-meta">Access code: <code>•••••• encrypted</code></div>
          </div>
          <button class="btn btn-subtle btn-sm" data-reset="${u.id}">${ICON.key} New code</button>
          <button class="btn btn-danger btn-sm" data-del="${u.id}">${ICON.trash}</button>
        </div>`;
    }).join("");

    panel.innerHTML = `
      <h2 class="section">Add a person</h2>
      <p class="subtle" style="margin:0 0 16px;">Give each person a name and a unique access code. Share the code with them privately — once saved, it's encrypted and can't be viewed again (only reset).</p>
      <form id="add-form" autocomplete="off" novalidate class="stack" style="margin-bottom:26px;">
        <div>
          <label class="field-label" for="np-name">Name <span class="req">*</span></label>
          <input class="input" id="np-name" placeholder="e.g. Maria" autocomplete="off" />
        </div>
        <div>
          <label class="field-label" for="np-code">Access code <span class="req">*</span></label>
          <div class="grid-2">
            <input class="input" id="np-code" placeholder="e.g. 345678" autocomplete="off" />
            <button type="button" class="btn btn-ghost" id="np-gen">Generate</button>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="np-add">${ICON.plus} Add person</button>
        </div>
      </form>

      <hr class="divider" />
      <h2 class="section" style="margin-bottom:14px;">People (${state.users.length})</h2>
      ${state.users.length===0 ? `<div class="empty">No people yet. Add someone above.</div>` : rows}`;

    el("np-gen").addEventListener("click", ()=>{
      el("np-code").value = String(Math.floor(100000 + Math.random()*900000));
    });

    el("add-form").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const name = el("np-name").value.trim();
      const code = el("np-code").value.trim();
      if(!name){ toast("Enter a name.", "err"); el("np-name").focus(); return; }
      if(!code){ toast("Enter an access code.", "err"); el("np-code").focus(); return; }
      const addBtn = el("np-add"); addBtn.disabled=true;
      if(await codeIsAdmin(code)){ addBtn.disabled=false; toast("That code is the admin code. Pick another.", "err"); return; }
      if(await codeMatchesUser(code)){ addBtn.disabled=false; toast("That code is already used by someone else.", "err"); return; }
      const cred = await makeCred(code);
      state.users.push({ id:uid(), name, salt:cred.salt, hash:cred.hash });
      saveState();
      toast(name+" added.", "ok");
      renderAdmin();
    });

    panel.querySelectorAll("[data-reset]").forEach(b=>{
      b.addEventListener("click", async ()=>{
        const u = state.users.find(x=>x.id===b.dataset.reset);
        if(!u) return;
        const code = prompt("Enter a NEW access code for "+u.name+":");
        if(code===null) return;
        const c = code.trim();
        if(!c){ toast("Code can't be empty.", "err"); return; }
        if(await codeIsAdmin(c)){ toast("That code is the admin code. Pick another.", "err"); return; }
        if(await codeMatchesUser(c, u.id)){ toast("That code is already used by someone else.", "err"); return; }
        const cred = await makeCred(c);
        u.salt = cred.salt; u.hash = cred.hash;
        saveState();
        toast(u.name+"'s code updated.", "ok");
      });
    });

    panel.querySelectorAll("[data-del]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const u = state.users.find(x=>x.id===b.dataset.del);
        if(!u) return;
        if(confirm("Remove "+u.name+"? Their submitted answers will also be deleted.")){
          state.users = state.users.filter(x=>x.id!==u.id);
          delete state.responses[u.id];
          saveState();
          toast(u.name+" removed.", "ok");
          renderAdmin();
        }
      });
    });
  }

  /* ----  Questions tab  ---- */
  function renderQuestions(panel){
    const rows = state.questions.map((q,i)=>`
      <div class="row">
        <div class="grow">
          <div class="row-title"><span class="q-index">Q${i+1}</span>${esc(q.text)}</div>
        </div>
        <button class="btn btn-danger btn-sm" data-delq="${q.id}">${ICON.trash}</button>
      </div>`).join("");

    panel.innerHTML = `
      <h2 class="section">Questions</h2>
      <p class="subtle" style="margin:0 0 16px;">These are the prompts each person answers. Changing them won't erase existing responses.</p>
      <form id="addq-form" class="stack" style="margin-bottom:24px;" novalidate>
        <div>
          <label class="field-label" for="nq-text">New question <span class="req">*</span></label>
          <input class="input" id="nq-text" placeholder="e.g. What's your availability next week?" autocomplete="off" />
        </div>
        <div class="actions"><button type="submit" class="btn btn-primary">${ICON.plus} Add question</button></div>
      </form>
      <hr class="divider" />
      <h2 class="section" style="margin-bottom:14px;">Current (${state.questions.length})</h2>
      ${state.questions.length===0?`<div class="empty">No questions yet. Add one above so people have something to answer.</div>`:rows}`;

    el("addq-form").addEventListener("submit",(e)=>{
      e.preventDefault();
      const text = el("nq-text").value.trim();
      if(!text){ toast("Enter the question text.", "err"); return; }
      state.questions.push({ id:uid(), text });
      saveState();
      toast("Question added.", "ok");
      renderAdmin();
    });

    panel.querySelectorAll("[data-delq]").forEach(b=>{
      b.addEventListener("click", ()=>{
        if(state.questions.length<=1){
          if(!confirm("This is the only question. Removing it leaves nothing for people to answer. Continue?")) return;
        }
        const q = state.questions.find(x=>x.id===b.dataset.delq);
        if(q && confirm("Remove this question? Existing answers to it stay stored but are hidden.")){
          state.questions = state.questions.filter(x=>x.id!==q.id);
          saveState();
          toast("Question removed.", "ok");
          renderAdmin();
        }
      });
    });
  }

  /* ----  Settings tab  ---- */
  function renderSettings(panel){
    panel.innerHTML = `
      <h2 class="section">Admin code</h2>
      <p class="subtle" style="margin:0 0 14px;">This is the code you use to reach this console. It's stored encrypted; keep it different from everyone's access codes.</p>
      <form id="adminpw-form" class="stack" style="margin-bottom:26px;" novalidate>
        <div>
          <label class="field-label" for="new-admin">New admin code <span class="req">*</span></label>
          <div class="pw-wrap">
            <input class="input" id="new-admin" type="password" placeholder="New admin code" autocomplete="off" />
            <button type="button" class="pw-toggle" id="admin-eye" data-target="new-admin" aria-label="Show code">${ICON.eye}</button>
          </div>
        </div>
        <div class="actions"><button type="submit" class="btn btn-primary" id="admin-save">Update admin code</button></div>
      </form>

      <hr class="divider" />
      <h2 class="section">Backup &amp; transfer</h2>
      <p class="subtle" style="margin:0 0 14px;">Data lives in this browser only. Export a backup file to keep it safe or move it to another device, then Import it there. (Access codes stay encrypted inside the backup.)</p>
      <div class="actions" style="margin-bottom:26px;">
        <button class="btn btn-ghost" id="exp-btn">${ICON.download} Export backup</button>
        <button class="btn btn-ghost" id="imp-btn">${ICON.upload} Import backup</button>
        <input type="file" id="imp-file" accept="application/json,.json" class="hidden" />
      </div>

      <hr class="divider" />
      <h2 class="section" style="color:#fca5a5;">Danger zone</h2>
      <p class="subtle" style="margin:0 0 14px;">Permanently delete every submitted answer (people and questions stay).</p>
      <div class="actions">
        <button class="btn btn-danger" id="reset-answers">${ICON.trash} Clear all responses</button>
        <button class="btn btn-danger" id="reset-all">${ICON.trash} Reset everything</button>
      </div>`;

    wireEye(el("admin-eye"));

    el("adminpw-form").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const v = el("new-admin").value.trim();
      if(!v){ toast("Enter a new admin code.", "err"); return; }
      const saveBtn = el("admin-save"); saveBtn.disabled=true;
      if(await codeMatchesUser(v)){ saveBtn.disabled=false; toast("That code belongs to a person. Pick another.", "err"); return; }
      const cred = await makeCred(v);
      state.adminSalt = cred.salt; state.adminHash = cred.hash;
      saveState();
      el("new-admin").value="";
      saveBtn.disabled=false;
      toast("Admin code updated.", "ok");
    });

    el("exp-btn").addEventListener("click", ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "answer-vault-backup.json";
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toast("Backup downloaded.", "ok");
    });

    el("imp-btn").addEventListener("click", ()=> el("imp-file").click());
    el("imp-file").addEventListener("change",(e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(!data || !Array.isArray(data.users) || !Array.isArray(data.questions) || !data.adminHash) throw new Error("bad");
          if(!confirm("Import will replace all current data with the backup. Continue?")) return;
          state = data;
          state.responses = state.responses || {};
          saveState();
          toast("Backup imported.", "ok");
          renderAdmin();
        }catch(err){ toast("That file isn't a valid Answer Vault backup.", "err"); }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    el("reset-answers").addEventListener("click", ()=>{
      if(confirm("Delete ALL submitted responses? This cannot be undone.")){
        state.responses = {};
        saveState();
        toast("All responses cleared.", "ok");
        renderAdmin();
      }
    });
    el("reset-all").addEventListener("click", async ()=>{
      if(confirm("Reset EVERYTHING back to defaults (Ahmed + Jorge, default question, admin code Zamora2000)? This cannot be undone.")){
        state = await buildDefaultState();
        saveState();
        toast("Everything reset.", "ok");
        renderAdmin();
      }
    });
  }

  /* ----------  boot  ---------- */
  (async function init(){
    state = loadState();
    if(!state){ state = await buildDefaultState(); saveState(); }
    state.questions = state.questions || [];
    state.users = state.users || [];
    state.responses = state.responses || {};
    showScreen("lock");
    setTimeout(()=>lockInput.focus(), 60);
  })();
})();
</script>
</body>
</html>
